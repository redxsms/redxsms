<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="redxsms premium banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b16">
        <animate attributeName="stop-color" values="#070b16;#0b1830;#070b16" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#0d1430">
        <animate attributeName="stop-color" values="#0d1430;#171d3d;#0d1430" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#090d1a">
        <animate attributeName="stop-color" values="#090d1a;#101b2c;#090d1a" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#47e6ff"/>
      <stop offset="50%" stop-color="#9b6bff"/>
      <stop offset="100%" stop-color="#b8ff6a"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
  </defs>
  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="28" fill="url(#grid)" opacity=".85"/>
  <circle cx="150" cy="70" r="110" fill="#47e6ff" opacity=".28" filter="url(#blur)">
    <animate attributeName="cx" values="120;300;120" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;150;70" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="190" r="120" fill="#9b6bff" opacity=".26" filter="url(#blur)">
    <animate attributeName="cx" values="1030;870;1030" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;90;190" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="250" r="80" fill="#b8ff6a" opacity=".14" filter="url(#blur)">
    <animate attributeName="cy" values="250;150;250" dur="13s" repeatCount="indefinite"/>
  </circle>
  <path d="M 60 196 L 1140 196" stroke="url(#line)" stroke-width="2" opacity=".7"/>
  <text x="60" y="122" fill="#eef3ff" font-family="Inter,Segoe UI,sans-serif" font-size="58" font-weight="800" letter-spacing="-2">REDXSMS</text>
  <text x="63" y="168" fill="#47e6ff" font-family="monospace" font-size="20" letter-spacing="4">BUILD · SHIP · REPEAT</text>
  <text x="1040" y="150" fill="#eef3ff" opacity=".9" font-family="monospace" font-size="24" font-weight="700">NEXUS</text>
  <rect x="60" y="218" width="180" height="8" rx="4" fill="url(#line)" opacity=".8"/>
</svg>
